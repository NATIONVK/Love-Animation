<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030207">
<meta name="description" content="A cinematic universe of particles, forming a heart and a galaxy.">
<title>I Love You — Infinity</title>
<style>
:root{color-scheme:dark;--accent:#ff397c}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030207}
body{font-family:Georgia,'Times New Roman',serif;color:#fff}
.scene{position:relative;width:100%;height:100%;height:100svh;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 50% 44%,#260817 0%,#100611 43%,#05030a 78%,#020105 100%)}
.scene:before{content:"";position:absolute;inset:-40%;z-index:0;pointer-events:none;background:conic-gradient(from 0deg,transparent 0 25%,#ff286d12 34%,transparent 45% 65%,#9b43ff10 76%,transparent 88%);filter:blur(70px);animation:aurora 34s linear infinite}
.scene:after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(ellipse at center,transparent 38%,#020106a8 100%)}
#universe{position:absolute;inset:0;width:100%;height:100%;z-index:1;touch-action:pan-y}
.glow{position:absolute;z-index:0;left:50%;top:44%;width:min(90vw,700px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#ff1b5b20 0%,#a20e5010 38%,transparent 70%);filter:blur(25px);animation:breathe 6s ease-in-out infinite}
.copy{position:absolute;z-index:4;left:0;right:0;bottom:max(9vh,58px);text-align:center;padding:0 18px;pointer-events:none;text-shadow:0 0 22px #ff286d77}
h1{margin:0;font-size:clamp(30px,7vw,58px);font-weight:400;letter-spacing:.24em;text-transform:uppercase;color:#fff0f6;animation:titleIn 2.2s both}
.subtitle{margin:13px 0 0;font:10px/1.8 system-ui,sans-serif;letter-spacing:.32em;text-transform:uppercase;color:#f6a9c6b8;transition:opacity .5s}
.hint{position:absolute;z-index:4;bottom:max(16px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;font:9px system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#d98aa888;pointer-events:none}
.controls{position:absolute;z-index:6;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(96%,760px);display:flex;justify-content:center;gap:7px;flex-wrap:wrap}
.controls button{border:1px solid #ff9abd55;background:#1a0916b8;color:#ffd7e5;border-radius:999px;padding:9px 12px;font:9px system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);cursor:pointer;transition:background .25s,border-color .25s,transform .25s}
.controls button:active{transform:scale(.95);background:#6d123b}
.controls button[aria-pressed=true]{background:#74183d99;border-color:#ff9abd}
.controls button:focus-visible{outline:2px solid #ff9abd;outline-offset:3px}
@keyframes aurora{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{opacity:.5;scale:.88}50%{opacity:1;scale:1.08}}
@keyframes titleIn{from{opacity:0;letter-spacing:.55em;filter:blur(8px)}to{opacity:1;letter-spacing:.24em;filter:blur(0)}}
@media(max-width:520px){.controls{gap:5px}.controls button{padding:8px 10px;font-size:8px;letter-spacing:.08em}.copy{bottom:9vh}}
@media(max-height:620px){.copy{bottom:7vh}h1{font-size:clamp(25px,5vw,40px)}.subtitle{margin-top:6px}}
@media(prefers-reduced-motion:reduce){.scene:before,.glow,h1{animation:none}}
</style>
</head>
<body>
<main class="scene">
<div class="glow"></div>
<nav class="controls" aria-label="Animation controls">
<button id="colorBtn" type="button">Color</button>
<button id="pulseBtn" type="button">Pulse</button>
<button id="modeBtn" type="button" aria-pressed="false">Galaxy</button>
<button id="trailBtn" type="button" aria-pressed="false">Trails off</button>
<button id="pauseBtn" type="button" aria-pressed="false">Pause</button>
<button id="fullBtn" type="button">Fullscreen</button>
</nav>
<canvas id="universe" aria-label="Animated heart and galaxy made of luminous particles"></canvas>
<section class="copy">
<h1>I Love You</h1>
<p class="subtitle" id="subtitle">A thousand lights · One heartbeat · Forever</p>
</section>
<div class="hint">Touch the universe · Double tap to change colors</div>
</main>
<script>
(()=> {
'use strict';
const canvas=document.getElementById('universe'),ctx=canvas.getContext('2d',{alpha:true});
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const palettes=[{h:350,s:100,l:68},{h:330,s:100,l:72},{h:285,s:95,l:72},{h:195,s:100,l:70},{h:42,s:100,l:70},{h:0,s:0,l:94},{h:12,s:100,l:68},{h:155,s:90,l:66},{h:260,s:100,l:76},{h:180,s:100,l:70},{h:305,s:100,l:72},{h:95,s:90,l:68}];
const messages=['A thousand lights · One heartbeat · Forever','Across every universe, I would find you','My favourite place is beside you','Infinite stars. One love.'];
let W=0,H=0,DPR=1,particles=[],stars=[],paletteIndex=0,raf=0,last=0,paused=false,galaxy=false,trails=false,lastTap=0,messageIndex=0;
let pointer={x:0,y:0,active:false,down:false};
const rand=(a,b)=>Math.random()*(b-a)+a,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function heartPoint(t){return{x:16*Math.pow(Math.sin(t),3),y:-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))}}
function targetsFor(count){
 const scale=Math.min(W/43,H/43,13.2),cx=W*.5,cy=H*.435,out=[];
 while(out.length<count){const x=rand(-16,16),y=rand(-14,13);if(Math.pow(x*x+y*y-1,3)-x*x*y*y*y<=0)out.push({x:cx+x*scale,y:cy-y*scale,edge:false})}
 const edgeCount=Math.round(count*.22);
 for(let i=0;i<edgeCount;i++){const p=heartPoint(Math.PI*2*i/edgeCount);out.push({x:cx+p.x*scale,y:cy-p.y*scale,edge:true})}
 return out;
}
function galaxyTarget(i,n){
 const a=i*2.399963,arm=Math.floor((i%5)),radius=Math.sqrt((i+1)/n)*Math.min(W,H)*.37;
 const twist=radius*.018,angle=a+arm*.11+twist;
 return{x:W*.5+Math.cos(angle)*radius,y:H*.435+Math.sin(angle)*radius*.57};
}
function resize(){
 W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,1.5);
 canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);
 const count=Math.round(clamp(W*H/1250,260,560)),targets=targetsFor(count);
 particles=targets.map((t,i)=>({x:W*.5+rand(-W*.4,W*.4),y:H*.45+rand(-H*.4,H*.4),vx:0,vy:0,tx:t.x,ty:t.y,heartX:t.x,heartY:t.y,gx:galaxyTarget(i,targets.length).x,gy:galaxyTarget(i,targets.length).y,size:t.edge?rand(1.2,2.1):rand(.65,1.55),phase:rand(0,Math.PI*2),twinkle:rand(.012,.035),edge:t.edge,z:rand(.55,1.5)}));
 stars=Array.from({length:Math.round(clamp(W*H/7000,45,150))},()=>({x:rand(0,W),y:rand(0,H),r:rand(.3,1.2),a:rand(.15,.7),p:rand(0,6.28)}));
}
function setMode(next){
 galaxy=next;
 particles.forEach(p=>{p.tx=galaxy?p.gx:p.heartX;p.ty=galaxy?p.gy:p.heartY});
 const b=document.getElementById('modeBtn');b.textContent=galaxy?'Heart':'Galaxy';b.setAttribute('aria-pressed',String(galaxy));
 document.getElementById('subtitle').textContent=galaxy?'Somewhere in infinity, it is still you':messages[0];
}
function color(p,t){const q=palettes[paletteIndex],h=(q.h+Math.sin(p.phase*.7)*9+360)%360,l=clamp(q.l+Math.sin(t*.001+p.phase)*10,48,94);return 'hsla('+h+','+q.s+'%,'+l+'%,'+(p.edge?.96:.8)+')'}
function render(t){
 const dt=Math.min(2.2,(t-last)/16.67||1);last=t;
 if(trails){ctx.fillStyle='rgba(3,2,7,.22)';ctx.fillRect(0,0,W,H)}else ctx.clearRect(0,0,W,H);
 for(const s of stars){s.p+=.004*dt;ctx.globalAlpha=s.a*(.65+.35*Math.sin(s.p));ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill()}
 const pal=palettes[paletteIndex];
 for(const p of particles){
  const dx=p.tx-p.x,dy=p.ty-p.y;
  p.vx+=(dx*.012-p.vx*.105)*dt;p.vy+=(dy*.012-p.vy*.105)*dt;
  if(pointer.active){const rx=p.x-pointer.x,ry=p.y-pointer.y,d=Math.hypot(rx,ry)+.001;if(d<165){const f=(1-d/165)*.62;p.vx+=rx/d*f*dt;p.vy+=ry/d*f*dt}}
  p.x+=(p.tx-p.x)*.012*dt+p.vx*dt;p.y+=(p.ty-p.y)*.012*dt+p.vy*dt;
  p.vx*=Math.pow(.91,dt);p.vy*=Math.pow(.91,dt);p.phase+=p.twinkle*dt;
  const tw=.55+.45*Math.sin(p.phase),depth=p.z,sz=p.size*depth*(.78+tw*.32);
  ctx.globalAlpha=.2+tw*.18;ctx.fillStyle='hsla('+pal.h+',100%,65%,.55)';ctx.beginPath();ctx.arc(p.x,p.y,sz*3.2,0,6.283);ctx.fill();
  ctx.globalAlpha=.5+tw*.48;ctx.fillStyle=color(p,t);ctx.beginPath();ctx.arc(p.x,p.y,sz,0,6.283);ctx.fill();
 }
 // Subtle connecting filaments make the galaxy feel three-dimensional.
 if(galaxy){ctx.globalAlpha=.12;ctx.strokeStyle='hsl('+pal.h+' 100% 75%)';ctx.lineWidth=.55;for(let i=0;i<particles.length-1;i+=7){const a=particles[i],b=particles[i+1];if(Math.hypot(a.x-b.x,a.y-b.y)<34){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}}
 ctx.globalAlpha=1;if(!reduced&&!paused)raf=requestAnimationFrame(render);
}
function pulse(){for(const p of particles){const dx=p.x-W*.5,dy=p.y-H*.435,d=Math.hypot(dx,dy)||1;p.vx+=dx/d*rand(2,5);p.vy+=dy/d*rand(2,5)}}
function changeColor(){paletteIndex=(paletteIndex+1)%palettes.length;pulse()}
function togglePause(){paused=!paused;const b=document.getElementById('pauseBtn');b.textContent=paused?'Resume':'Pause';b.setAttribute('aria-pressed',String(paused));if(paused)cancelAnimationFrame(raf);else{last=0;raf=requestAnimationFrame(render)}}
document.getElementById('colorBtn').addEventListener('click',changeColor);
document.getElementById('pulseBtn').addEventListener('click',pulse);
document.getElementById('modeBtn').addEventListener('click',()=>setMode(!galaxy));
document.getElementById('trailBtn').addEventListener('click',()=>{trails=!trails;const b=document.getElementById('trailBtn');b.textContent=trails?'Trails on':'Trails off';b.setAttribute('aria-pressed',String(trails));if(!trails)ctx.clearRect(0,0,W,H)});
document.getElementById('pauseBtn').addEventListener('click',togglePause);
document.getElementById('fullBtn').addEventListener('click',async()=>{try{if(!document.fullscreenElement)await document.querySelector('.scene').requestFullscreen();else await document.exitFullscreen()}catch(e){document.getElementById('fullBtn').textContent='Fullscreen unavailable'}});
function point(e){const r=canvas.getBoundingClientRect();pointer.x=e.clientX-r.left;pointer.y=e.clientY-r.top}
canvas.addEventListener('pointerdown',e=>{pointer.down=true;pointer.active=true;point(e);canvas.setPointerCapture?.(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(pointer.down){pointer.active=true;point(e)}});
function release(){pointer.down=false;pointer.active=false}
canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
canvas.addEventListener('click',()=>{const now=performance.now();if(now-lastTap<330){changeColor();lastTap=0}else{pulse();lastTap=now}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelAnimationFrame(raf);else if(!reduced&&!paused){last=0;raf=requestAnimationFrame(render)}});
addEventListener('resize',resize,{passive:true});
resize();if(!reduced)raf=requestAnimationFrame(render);else render(0);
})();
</script>
</body>
</html>
