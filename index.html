<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030207">
<meta name="description" content="A cinematic heart formed from flowing luminous particles.">
<title>I Love You — Infinite</title>
<style>
:root{color-scheme:dark;--glow:#ff286d;--soft:#ff9abd}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030207}
body{font-family:Georgia,'Times New Roman',serif;color:#fff}
.scene{position:relative;width:100%;height:100%;height:100svh;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 50% 46%,#260817 0%,#100611 42%,#05030a 78%,#020105 100%)}
.scene:before{content:"";position:absolute;inset:-40%;z-index:0;pointer-events:none;background:conic-gradient(from 0deg,transparent 0 25%,#ff286d12 34%,transparent 45% 65%,#9b43ff10 76%,transparent 88%);filter:blur(70px);animation:aurora 32s linear infinite}
.scene:after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(ellipse at center,transparent 38%,#020106a8 100%)}
#particle-heart{position:absolute;inset:0;width:100%;height:100%;z-index:1;touch-action:pan-y}
.vignette-glow{position:absolute;z-index:0;left:50%;top:46%;width:min(90vw,700px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#ff1b5b20 0%,#a20e5010 38%,transparent 70%);filter:blur(25px);animation:pulseGlow 5s ease-in-out infinite}
.copy{position:absolute;z-index:4;left:0;right:0;bottom:max(9vh,55px);text-align:center;padding:0 18px;pointer-events:none;text-shadow:0 0 22px #ff286d77}
h1{margin:0;font-size:clamp(30px,7vw,58px);font-weight:400;letter-spacing:.24em;text-transform:uppercase;color:#fff0f6}
.subtitle{margin:13px 0 0;font:10px/1.8 system-ui,sans-serif;letter-spacing:.32em;text-transform:uppercase;color:#f6a9c6b8}
.hint{position:absolute;z-index:4;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;font:9px system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#d98aa888;pointer-events:none}\n.controls{position:absolute;z-index:6;top:max(18px,env(safe-area-inset-top));right:16px;display:flex;gap:8px}\n.controls button{border:1px solid #ff9abd55;background:#1a0916a8;color:#ffd7e5;border-radius:999px;padding:10px 14px;font:9px system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}\n.controls button:active{transform:scale(.96);background:#6d123b}\n.controls button:focus-visible{outline:2px solid #ff9abd;outline-offset:3px}
@keyframes aurora{to{transform:rotate(360deg)}}
@keyframes pulseGlow{0%,100%{opacity:.55;scale:.88}50%{opacity:1;scale:1.08}}
@media(max-height:620px){.copy{bottom:7vh}h1{font-size:clamp(25px,5vw,40px)}.subtitle{margin-top:6px}}
@media(prefers-reduced-motion:reduce){.scene:before,.vignette-glow{animation:none}}
</style>
</head>
<body>
<main class="scene">
<div class="vignette-glow"></div>\n<nav class="controls" aria-label="Animation controls"><button id="colorBtn" type="button">Color</button><button id="burstBtn" type="button">Pulse</button><button id="pauseBtn" type="button">Pause</button></nav>
<canvas id="particle-heart" aria-label="A glowing heart made from animated particles"></canvas>
<section class="copy">
<h1>I Love You</h1>
<p class="subtitle">A thousand lights · One heartbeat · Forever</p>
</section>
<div class="hint">Touch the heart · Double tap to change colors</div>
</main>
<script>
(()=> {
'use strict';
const canvas=document.getElementById('particle-heart');
const ctx=canvas.getContext('2d',{alpha:true});
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const palettes=[
 {h:350,s:100,l:68},{h:330,s:100,l:72},{h:285,s:95,l:72},
 {h:195,s:100,l:70},{h:42,s:100,l:70},{h:0,s:0,l:94},
 {h:12,s:100,l:68},{h:155,s:90,l:66},{h:260,s:100,l:76},
 {h:180,s:100,l:70},{h:305,s:100,l:72},{h:95,s:90,l:68}
];
let W=0,H=0,DPR=1,particles=[],targets=[],paletteIndex=0,raf=0,last=0,paused=false;
let pointer={x:0,y:0,active:false,down:false},lastTap=0;
const rand=(a,b)=>Math.random()*(b-a)+a;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function heartPoint(t){
 const x=16*Math.pow(Math.sin(t),3);
 const y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
 return{x,y};
}
function dimensions(){
 W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,1.65);
 canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
 canvas.style.width=W+'px';canvas.style.height=H+'px';
 ctx.setTransform(DPR,0,0,DPR,0,0);
 buildHeart();
}
function buildHeart(){
 const scale=Math.min(W/43,H/43,13.2);
 const cx=W*.5,cy=H*.435;
 const count=Math.round(clamp(W*H/1450,210,470));
 targets=[];
 // Uniformly distribute particles through the heart interior using rejection sampling.
 while(targets.length<count){
   const x=rand(-16,16),y=rand(-14,13);
   const inside=Math.pow(x*x+y*y-1,3)-x*x*y*y*y<=0;
   if(inside)targets.push({x:cx+x*scale,y:cy-y*scale});
 }
 // Add a denser luminous outline.
 const edgeCount=Math.round(count*.22);
 for(let i=0;i<edgeCount;i++){
   const p=heartPoint(Math.PI*2*i/edgeCount);
   targets.push({x:cx+p.x*scale,y:cy-p.y*scale,edge:true});
 }
 particles=targets.map((t,i)=>({
   x:cx+rand(-24,24),y:cy+rand(-24,24),
   ox:cx+rand(-W*.48,W*.48),oy:rand(-H*.2,H*1.2),
   tx:t.x,ty:t.y,vx:0,vy:0,
   size:t.edge?rand(1.15,2.1):rand(.65,1.55),
   phase:rand(0,Math.PI*2),twinkle:rand(.012,.035),
   edge:!!t.edge,seed:Math.random()
 }));
}
function color(p,t){
 const pal=palettes[paletteIndex];
 const hue=(pal.h+Math.sin(p.phase*.7)*9+360)%360;
 const light=clamp(pal.l+Math.sin(t*.001+p.phase)*10,48,94);
 return 'hsla('+hue+','+pal.s+'%,'+light+'%,'+(p.edge?.94:.76)+')';
}
function render(t){
 const dt=Math.min(2.2,(t-last)/16.67||1);last=t;
 ctx.clearRect(0,0,W,H);
 const pal=palettes[paletteIndex];
 for(const p of particles){
   const dx=p.tx-p.x,dy=p.ty-p.y;
   // Smooth spring attraction: particles settle into a stable heart silhouette.
   p.vx+=(dx*.012-p.vx*.105)*dt;
   p.vy+=(dy*.012-p.vy*.105)*dt;
   // Gentle breathing motion without shaking the heart outline.
   const breathe=Math.sin(t*.0011+p.phase)*.45;
   let tx=p.tx+breathe,ty=p.ty+breathe*.55;
   if(pointer.active){
     const rx=p.x-pointer.x,ry=p.y-pointer.y;
     const dist=Math.sqrt(rx*rx+ry*ry)+.001;
     if(dist<155){const force=(1-dist/155)*.52;p.vx+=(rx/dist)*force*dt;p.vy+=(ry/dist)*force*dt}
   }
   p.x+=(tx-p.x)*.012*dt+p.vx*dt;
   p.y+=(ty-p.y)*.012*dt+p.vy*dt;
   p.vx*=Math.pow(.91,dt);p.vy*=Math.pow(.91,dt);
   p.phase+=p.twinkle*dt;
   const tw=.55+.45*Math.sin(p.phase);
   const r=p.size*(p.edge?1.15:1)*(.78+tw*.32);
   // A soft halo under each luminous particle.
   ctx.globalAlpha=.22+tw*.2;
   ctx.fillStyle='hsla('+pal.h+',100%,65%,.55)';
   ctx.beginPath();ctx.arc(p.x,p.y,r*3.1,0,Math.PI*2);ctx.fill();
   ctx.globalAlpha=.55+tw*.42;ctx.fillStyle=color(p,t);
   ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();
 }
 ctx.globalAlpha=1;
 if(!reduced)raf=requestAnimationFrame(render);
}
function changePalette(){
 paletteIndex=(paletteIndex+1)%palettes.length;
 // A brief outward ripple, then all particles smoothly return to their heart targets.
 for(const p of particles){const dx=p.x-W/2,dy=p.y-H*.44,d=Math.hypot(dx,dy)||1;p.vx+=(dx/d)*rand(1.2,2.8);p.vy+=(dy/d)*rand(1.2,2.8)}
}
function pulseHeart(){
 // Send a travelling wave through the particle field; spring forces reform the heart.
 for(const p of particles){
   const dx=p.x-W*.5,dy=p.y-H*.435,d=Math.hypot(dx,dy)||1;
   p.vx+=(dx/d)*rand(2.2,5.2);p.vy+=(dy/d)*rand(2.2,5.2);
 }
}
function togglePause(){
 paused=!paused;
 const b=document.getElementById('pauseBtn');
 b.textContent=paused?'Resume':'Pause';
 if(paused)cancelAnimationFrame(raf);
 else{last=0;raf=requestAnimationFrame(render)}
}
document.getElementById('colorBtn').addEventListener('click',changePalette);
document.getElementById('burstBtn').addEventListener('click',pulseHeart);
document.getElementById('pauseBtn').addEventListener('click',togglePause);
function pointFromEvent(e){const r=canvas.getBoundingClientRect();pointer.x=e.clientX-r.left;pointer.y=e.clientY-r.top}
canvas.addEventListener('pointerdown',e=>{pointer.down=true;pointer.active=true;pointFromEvent(e);canvas.setPointerCapture?.(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(pointer.down){pointer.active=true;pointFromEvent(e)}});
function release(){pointer.down=false;pointer.active=false}
canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
canvas.addEventListener('click',e=>{
 const now=performance.now();
 if(now-lastTap<330){changePalette();lastTap=0}else{pulseHeart();lastTap=now;}
});
addEventListener('resize',dimensions,{passive:true});
document.addEventListener('visibilitychange',()=>{
 if(document.hidden)cancelAnimationFrame(raf);
 else if(!reduced&&!paused){last=0;raf=requestAnimationFrame(render)}
});
dimensions();
if(!reduced)raf=requestAnimationFrame(render);
else render(0);
})();
</script>
</body>
</html>
